name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build build/Release

      - name: Report image size
        run: arm-none-eabi-size build/Release/KiisuCompanion.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiisuCompanion-Release
          path: |
            build/Release/KiisuCompanion.elf
            build/Release/KiisuCompanion.bin
          if-no-files-found: error
