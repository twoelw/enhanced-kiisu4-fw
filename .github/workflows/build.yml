name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '15.2.Rel1'

      - name: Install Ninja
        run: sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset Release

      - name: Build
        run: cmake --build build/Release

      - name: Report image size
        run: arm-none-eabi-size build/Release/KiisuCompanion.elf

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KiisuCompanion-Release
          path: |
            build/Release/KiisuCompanion.elf
            build/Release/KiisuCompanion.bin
          if-no-files-found: error

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          body: |
            Automatically updated on every push to `main`.

            - Commit: ${{ github.sha }}
            - Built with arm-none-eabi-gcc 15.2.Rel1, Release preset
            - Flash `KiisuCompanion.bin` via Kiisu Companion Bridge (see README).
          files: |
            build/Release/KiisuCompanion.elf
            build/Release/KiisuCompanion.bin
          make_latest: 'true'
          prerelease: false
